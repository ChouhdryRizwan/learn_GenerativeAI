<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Image Generator - Vanilla JS</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background: #1a1a2e;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      color: #00ff88;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 15px;
      border: 2px solid #00ff88;
      border-radius: 12px;
      background: #16213e;
      color: white;
      font-size: 16px;
      margin-bottom: 15px;
      resize: vertical;
    }
    button {
      padding: 14px 32px;
      font-size: 18px;
      background: #00ff88;
      color: #000;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    button:hover { background: #00cc66; }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #result {
      margin-top: 30px;
    }
    #generatedImage {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
      margin: 20px 0;
    }
    .download-btn {
      margin-top: 15px;
      padding: 12px 28px;
      background: #0088ff;
      color: white;
    }
    .download-btn:hover { background: #0066cc; }
    .loader {
      display: none;
      margin: 20px auto;
      width: 50px;
      height: 50px;
      border: 6px solid #333;
      border-top: 6px solid #00ff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Image Generator</h1>
    <p>Powered by Hugging Face + FLUX.1</p>

    <textarea id="prompt" placeholder="Describe your image... e.g., A futuristic cityscape at sunset, cyberpunk style, highly detailed"></textarea>
    <br/>
    <button id="generateBtn">Generate Image</button>

    <div class="loader" id="loader"></div>

    <div id="result"></div>
  </div>

  <script>
    const promptInput = document.getElementById("prompt");
    const generateBtn = document.getElementById("generateBtn");
    const loader = document.getElementById("loader");
    const resultDiv = document.getElementById("result");

    // Optional: Add your HF token here for more models (not required for FLUX.1-schnell)
    const HF_TOKEN = "YOUR_KEY_HERE"; // Leave empty for public models

    generateBtn.addEventListener("click", async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        alert("Please enter a description!");
        return;
      }

      // UI: Show loading
      generateBtn.disabled = true;
      generateBtn.textContent = "Generating...";
      loader.style.display = "block";
      resultDiv.innerHTML = "";

      try {
        const response = await fetch("https://router.huggingface.co/hf-inference/models/black-forest-labs/FLUX.1-schnell", {
          method: "POST",
          headers: {
            "Authorization": HF_TOKEN ? `Bearer ${HF_TOKEN}` : "",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            inputs: prompt,
            parameters: {
              num_inference_steps: 4,  // FLUX.1-schnell is super fast
              guidance_scale: 0.0,
            }
          })
        });

        if (!response.ok) {
          const err = await response.text();
          throw new Error(`HF API Error: ${response.status} - ${err}`);
        }

        const blob = await response.blob();
        const imageUrl = URL.createObjectURL(blob);

        // Display image
        const img = document.createElement("img");
        img.src = imageUrl;
        img.id = "generatedImage";
        img.alt = "Generated AI Art";

        const downloadBtn = document.createElement("button");
        downloadBtn.textContent = "Download Image";
        downloadBtn.className = "download-btn";
        downloadBtn.onclick = () => {
          const a = document.createElement("a");
          a.href = imageUrl;
          a.download = `ai-art-${Date.now()}.png`;
          a.click();
        };

        resultDiv.appendChild(img);
        resultDiv.appendChild(downloadBtn);

      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = `<p style="color: #ff6b6b;">Error: ${error.message}</p>`;
      } finally {
        // UI: Reset
        loader.style.display = "none";
        generateBtn.disabled = false;
        generateBtn.textContent = "Generate Image";
      }
    });

    // Auto-focus prompt
    promptInput.focus();
  </script>
</body>
</html>
